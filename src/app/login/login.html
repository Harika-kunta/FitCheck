<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<div class="breadcrumb-container">
        <a href="#">Home</a>
        <span> &gt; Login</span>
    </div>

<div class ="container">
    <h1 id="form-title">Login</h1>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" id="auth-form">
        <input type="email" [(ngModel)]="email" name="email" id="email" placeholder="Email" required>
         <input type="password" [(ngModel)]="password" name="password" id="password" placeholder="password" required>
         <button type="submit" [disabled]="loginForm.invalid" id="submit-btn">Login</button>
         <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
    </form>
    <p class="switch-link">Forgot Password?</p>
    <div class="register-link">
  <p>Don't have an account? 
    <a routerLink="/register">Register here</a>
  </p>
</div>

</div>
