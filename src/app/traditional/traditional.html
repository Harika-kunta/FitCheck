<div class="breadcrumb-container">
        <a href="#">Home</a>
        <span> &gt; Traditional wear</span>
    </div>

<div class="section">
    <div class="container">
<div class="product-grid">

            <div class="product-card" *ngFor="let product of products" [routerLink]="['/product', product.id]">
                <div class="product-image">
                   <i class="fa-regular fa-heart wishlist-icon"
                [ngClass]="isInWishlist(product.id) ? 'fa-solid active' : 'fa-regular'"
           (click)="toggleWishlist(product); $event.stopPropagation()"></i>
                    <a href="javascript:void(0)">

                        <img [src]="product.image" alt="{{ product.name }}"></a></div>

                <div class="product-info">
                    <h3>{{product.name}}</h3>
                    <span>₹{{ product.price }}</span>
                </div>
                
            </div>
        </div>
       
        <div class="view-more">
            <a href="" class="btn-outline">
                View More
            </a>
        </div>

    </div>
</div>
